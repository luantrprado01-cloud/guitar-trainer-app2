name: Gerar APK Guitar Trainer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Descompactar o projeto
        run: |
          mkdir -p build-project
          unzip -q APP2_Guitar_Trainer_ANDROID_NATIVE_v4.zip -d build-project
          ls -la build-project/APP2_Guitar_Trainer_ANDROID_NATIVE_v4

      - name: Compilar APK
        working-directory: build-project/APP2_Guitar_Trainer_ANDROID_NATIVE_v4
        run: gradle :app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Guitar-Trainer-APK
          path: build-project/APP2_Guitar_Trainer_ANDROID_NATIVE_v4/app/build/outputs/apk/debug/app-debug.apk
